services:
  alfa-recsys:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alfa-course-recsys
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      # Опционально: можно передать OPENAI_API_KEY для LLM-обогащения объяснений
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
